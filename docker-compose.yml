version: "3.8"

services:
  controlplane:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: controlplane-proxy
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CONTROLPLANE_MOCK_MODE=${CONTROLPLANE_MOCK_MODE:-true}
      - UPSTREAM_URL=${UPSTREAM_URL:-https://api.openai.com/v1/chat/completions}
      - CONTROLPLANE_POLICY_PATH=config/policies.yaml
      - CONTROLPLANE_DB_PATH=data/audit_logs.db
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./dashboard:/app/dashboard:ro
      - ./controlplane:/app/controlplane:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
